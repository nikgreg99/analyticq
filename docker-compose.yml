
services:

  rabbitmq-broker:
      image: rabbitmq:${RABBITMQ_VERSION}-management
      container_name: rabbitmq-broker
      restart: always
      env_file: .env
      ports:
        - "${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}"
        - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      networks:
        - analyticq-network

  celery-worker:
    build:
      context: ./analyticq-backend
      dockerfile: Dockerfile
    container_name: celery_worker
    restart: always
    env_file: .env
    environment:
      CELERY_HOSTNAME: ${CELERY_HOSTNAME}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_TASK_SERIALIZER: ${CELERY_TASK_SERIALIZER}
      CELERY_ACCEPT_CONTENT: ${CELERY_ACCEPT_CONTENT}
      CELERY_BROKER_CONNECTION_RETRY_ON_SETUP: ${CELERY_BROKER_CONNECTION_RETRY_ON_SETUP}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE}
      CELERY_ENABLE_UTC: ${CELERY_ENABLE_UTC}
    depends_on:
        - rabbitmq-broker
        - postgres
    networks:
      - analyticq-network
    command: celery -A analyticq.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: ./analyticq-backend
      dockerfile: Dockerfile
    container_name: celery_beat
    restart: always
    env_file: .env
    environment:
      CELERY_HOSTNAME: ${CELERY_HOSTNAME}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_TASK_SERIALIZER: ${CELERY_TASK_SERIALIZER}
      CELERY_ACCEPT_CONTENT: ${CELERY_ACCEPT_CONTENT}
      CELERY_BROKER_CONNECTION_RETRY_ON_SETUP: ${CELERY_BROKER_CONNECTION_RETRY_ON_SETUP}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE}
      CELERY_ENABLE_UTC: ${CELERY_ENABLE_UTC}
    depends_on:
        - rabbitmq-broker
        - celery-worker
        - postgres
    networks:
      - analyticq-network
    command: celery -A analyticq.celery_app beat --loglevel=info


  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: analyticq-db-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"  # Mapping PostgreSQL port to local machine
    networks:
      - analyticq-network
    entrypoint: >
      bash -c "
        docker-entrypoint.sh postgres &
        sleep 10 &&
        until pg_isready -h localhost -U ${POSTGRES_ROOT_USER}; do
          sleep 2;
        done;
        psql -U ${POSTGRES_ROOT_USER} -d ${POSTGRES_DB} -c \"CREATE USER ${POSTGRES_NON_ROOT_USER} WITH PASSWORD '${POSTGRES_NON_ROOT_PASSWORD}';\"
        psql -U ${POSTGRES_ROOT_USER} -d ${POSTGRES_DB} -c \"GRANT ALL PRIVILEGES ON DATABASE ${POSTGRES_DB} TO ${POSTGRES_NON_ROOT_USER};\"
        wait
      "
  mongo:
    image: mongodb/mongodb-community-server:${MONGO_VERSION}
    container_name: analyticq-db-mongo
    restart: always
    env_file: .env
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    networks:
      - analyticq-network
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_USERNAME: ${MONGO_INITDB_USERNAME}
      MONGO_INITDB_PASSWORD: ${MONGO_INITDB_PASSWORD}


  analyticq-backend:
    build:
      context: ./analyticq-backend
      dockerfile: Dockerfile
    container_name: analyticq-backend
    env_file: .env
    depends_on:
    - rabbitmq-broker
    - postgres
    networks:
      - analyticq-network

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  postgres_data:
    name: postgres_data
  mongo_data:
    name: mongo_fata

networks:
  analyticq-network:
    driver: bridge
