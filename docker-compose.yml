services:

  rabbitmq-broker:
      image: rabbitmq:${RABBITMQ_VERSION}-management
      container_name: rabbitmq-broker
      restart: always
      env_file: .env
      ports:
        - "${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}"
        - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      networks:
        - analyticq-network

  docker-dind:
    image:  docker:${DOCKER_VERSION:-24-dind}
    container_name: docker-dind
    restart: always
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""  # Disable TLS for internal communication
    volumes:
      - docker-data:/var/lib/docker
      - analyticq-data:/analyticq-data  # Shared volume for data exchange
    networks:
      - analyticq-network
    expose:
      - "2375"
    command: >
      dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2375

  postgres:

    image: postgres:${POSTGRES_VERSION}
    container_name: analyticq-db-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"  # Mapping PostgreSQL port to local machine
    networks:
      - analyticq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ROOT_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    entrypoint: >
      bash -c "
        docker-entrypoint.sh postgres &
        sleep 10 &&
        until pg_isready -h localhost -U ${POSTGRES_ROOT_USER}; do
          sleep 2;
        done;
        psql -U ${POSTGRES_ROOT_USER} -d ${POSTGRES_DB} -c \"CREATE USER ${POSTGRES_NON_ROOT_USER} WITH PASSWORD '${POSTGRES_NON_ROOT_PASSWORD}';\"
        psql -U ${POSTGRES_ROOT_USER} -d ${POSTGRES_DB} -c \"GRANT ALL PRIVILEGES ON DATABASE ${POSTGRES_DB} TO ${POSTGRES_NON_ROOT_USER};\"
        wait
      "

  analyticq-frontend:
    build:
      context: ./analyticq-frontend
      dockerfile: Dockerfile
    container_name: analyticq-frontend
    restart: always
    ports:
      - "8080:5173"
    env_file:
     - .env
    depends_on:
      - postgres
      - analyticq-backend
    networks:
      - analyticq-network

  analyticq-backend:
    build:
      context: ./analyticq-backend
      dockerfile: Dockerfile
    container_name: analyticq-backend
    privileged: true
    env_file: .env
    environment:
      - RUNNING_IN_DOCKER=true
      - ANALYTICQ_TMP_BASE=/analyticq-data
      - DOCKER_HOST=tcp://docker-dind:2375
    ports:
      - "8000:8000"
    restart: always
    depends_on:
     postgres:
      condition: service_healthy
     docker-dind:
      condition: service_started
    volumes:
      - analyticq-data:/analyticq-data
    networks:
      - analyticq-network

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  postgres_data:
    name: postgres_data
  analyticq-data:
    name: analyticq-data
  docker-data:
    name: docker-data

networks:
  analyticq-network:
    driver: bridge
