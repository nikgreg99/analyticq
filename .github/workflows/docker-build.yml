name: Docker Build and Push Workflow

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
        default: 'docker/Dockerfile' # Path to Dockerfile
      context:
        required: true
        type: string
        default: 'docker' # Default path to context (same as Dockerfile folder )

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            -t ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/${{inputs.image_name}}:latest \
            -f ${{ inputs.dockerfile }} ${{ inputs.context }} \
            --push

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io
