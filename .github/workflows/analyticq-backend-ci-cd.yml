env:
  SECRET_KEY: "test_env_secret_key"
  ANALYTICQ_CONFIG: '{"host": "localhost", "port": 8000}'

name: CI/CD for analyticq-backend

permissions:
  contents: read
  packages: write
  actions: read

on:
  push:
    branches:
      - dev

jobs:
    build-and-test:
        runs-on: ubuntu-22.04
        steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Set up Python 3.11
          uses: actions/setup-python@v2
          with:
            python-version: 3.11

        - name: Install backend dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r analyticq-backend/requirements.txt --no-deps

        - name: Setup configuration files
          run: |
            echo "SECRET_KEY=test_env_secret_key" > analyticq-backend/config/.env.test
            echo '{"host": "localhost", "port": 8000}' > analyticq-backend/config/analyticq_backend_config.json

        - name: Run unit tests with Pytest
          run: |
            python -m pip install pytest pytest-asyncio
            pytest analyticq-backend/tests/unit

        - name: Run SAST analysis backend with Bandit
          run: |
            python -m pip install bandit
            TIMESTAMP=$(date +"%Y$m%d_%H%M%S")
            bandit -r analyticq-backend -x analyticq-backend/tests -o bandit-report_$TIMESTAMP.txt -f txt --exit-zero

        - name: Upload Bandit report as artifact
          uses: actions/upload-artifact@v4
          with:
            name: bandit-report-${{ github.run_number}} ${{ github.sha }}
            path: bandit-report*.txt

    build-and-push:
        runs-on: ubuntu-22.04
        needs: build-and-test
        steps:
           - name: Checkout code
             uses: actions/checkout@v2

           - name: Log in to Docker hub
             uses: docker/login-action@v2
             with:
               username: ${{ github.actor}}
               password: ${{ secrets.GITHUB_TOKEN}}
               registry: ghcr.io

           - name: Set up Docker Buildx
             uses: docker/setup-buildx-action@v2

           - name: Build and push backend Docker image
             run: |
                 docker buildx create --use
                 docker buildx build -t ghcr.io/${{ github.repository }}/analyticq-backend:${{ github.sha }} -f ./analyticq-backend/Dockerfile ./analyticq-backend --push

           - name: Log out from Docker Hub
             run: docker logout ghcr.io
