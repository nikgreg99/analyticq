name: CI/CD for analytict-frontend

permissions:
  contents: read
  packages: write
  actions: read

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
            node-version: 22.13.0

      - name: Install frontend dependencies
        working-directory: analyticq-frontend
        run: npm install

      - name: Run Prettier check
        working-directory: analyticq-frontend
        run: |
            npx prettier . --check > prettier-report.txt

      - name: Upload Prettier Report
        uses: actions/upload-artifact@v4
        with:
            name: prettier-report-${{ github.run_number }}-${{ github.sha }}
            path: analyticq-frontend/prettier-report.txt

      - name: Run ESLint
        working-directory: analyticq-frontend
        run: |
            npx eslint . --ext .js,.ts,.jsx,.tsx -f json -o eslint-report.json

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
            name: eslint-report-${{ github.run_number }}-${{ github.sha }}
            path: analyticq-frontend/eslint-report.json


      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name:  Build and push analytict-frontend Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/${{ github.repository_owner }}/analytict-frontend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/analytict-frontend:latest \
            -f ./analyticq-frontend/Dockerfile ./analyticq-frontend \
            --push

      - name:  Log out from GHCR
        run: docker logout ghcr.io
