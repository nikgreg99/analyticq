
name: CI/CD for analyticq-backend

on:
    push:
        branches:
            - dev

jobs:
    build-and-test:
        runs-on: ubuntu-22.04
        steps:
        - name: Checkout code
          uses: actions/checkout@v2
        
        - name: Set up Python 3.11
          uses: actions/setup-python@v2
          with:
            python-version: 3.11
        
        - name: Install backend dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r analyticq-backend/requirements.txt
        
    build-and-push:
        runs-on: ubuntu-22.04
        needs: build-and-test
        steps:
           - name: Checkout code
             uses: actions/checkout@v2
   
           - name: Log in to Docker hub
             uses: docker/login-action@v2
             with:
               username: ${{ github.actor}}
               password: ${{ secrets.GITHUB_TOKEN}}
               registry: ghcr.io
            
           - name: Set up Docker Buildx
             uses: docker/setup-buildx-action@v2

           - name: Build and tag backend Docker image
             run: |
                docker build -t ghcr.io/${{ github.repository }}/analyticq-backend:${{ github.sha }} /analyticq-backend/Dockerfile
           
           - name: Push Docker image to Github Container registry
             run: |
                    docker push ghcr.io/${{ github.repository }}/analyticq-backend:${{ github.sha }}