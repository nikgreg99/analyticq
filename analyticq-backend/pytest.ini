[pytest]
asyncio_mode = auto
testpaths = tests
python_path = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    asyncio: mark test as async/await test
    integration: mark test as integration
    docker: mark test as requiring docker daemon

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
